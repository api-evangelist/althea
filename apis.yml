aid: althea
name: Althea
description: >-
  Althea (Althea Global, us.althea.kr) is a Seoul-founded K-beauty e-commerce
  company operating an online marketplace that curates and ships authentic
  Korean skincare, makeup, and hair and body-care products directly from Korea to
  more than 200 countries, with regional storefronts for the USA, Korea,
  Malaysia, Singapore, and the Philippines. Founded in 2015 and backed by 500
  Global, Tekton Ventures, FirstFloor Capital, InnoVen Capital, and Korea
  Development Bank, the platform runs on Shopify and exposes a native
  agent-commerce surface: a live Shopify Storefront MCP server, a Universal
  Commerce Protocol (UCP) merchant profile and MCP endpoint, Shopify Customer
  Account OpenID Connect, and published /llms.txt and /agents.md agent
  instructions for AI shopping assistants.
